x-test-env: &test-env
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent_test
  # Public disposable test credentials only; no real provider credentials are used.
  API_KEY: test-key
  SECRET_KEY: disposable-test-signing-key
  ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  ALLOW_CLOUD_PROCESSING: 'false'
  LANGSMITH_TRACING: 'false'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emailagent_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emailagent_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment: *test-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.graph.checkpointer"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment: *test-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/readyz', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment: *test-env
    command: ["python", "-m", "app.workers.poller"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build: {context: ../apps/web, dockerfile: Dockerfile}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on: {api: {condition: service_healthy}}
  tests:
    build: {context: .., dockerfile: deploy/Dockerfile.test}
    environment:
      <<: *test-env
      WEB_SMOKE_URL: http://web:8080
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent_test
    depends_on: {api: {condition: service_healthy}, worker: {condition: service_started}, web: {condition: service_healthy}}
