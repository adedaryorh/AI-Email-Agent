services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emailagent
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emailagent"]
      interval: 5s
      retries: 10
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent
    command: ["sh", "-c", "alembic upgrade head && python -m app.graph.checkpointer"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent
    command: ["python", "-m", "app.workers.poller"]
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build: {context: ../apps/web, dockerfile: Dockerfile}
    ports: ["127.0.0.1:4200:8080"]
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
  retention:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/emailagent
    command: ["python", "-m", "app.workers.retention"]
    profiles: ["maintenance"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata:
