[project]
name = "ai-email-agent"
version = "0.2.0"
description = "Gmail backend: classification, extraction, rules, reviewed drafting and explicit sending"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<5",
  "langchain>=1.0,<2",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["postgres: requires TEST_POSTGRES_URL pointing to a disposable PostgreSQL database"]
